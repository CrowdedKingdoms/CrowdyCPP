mutation MinecraftChallenge($appId: BigInt!) {
  minecraftChallenge(appId: $appId) {
    serverId
    expiresAt
  }
}

mutation SignInWithMinecraft($input: SignInWithMinecraftInput!) {
  signInWithMinecraft(input: $input) {
    token
    gameTokenId
    userId
    appId
    expiresAt
    applicationApiUrl
    gameApiUrl: applicationApiUrl
    applicationApiWsUrl
    gameApiWsUrl: applicationApiWsUrl
    discoveryUrl
    launchUrl
    runtimeGate {
      status
      reason
    }
  }
}
