mutation CpCreditOrgWallet(
  $orgId: BigInt!
  $amountCents: BigInt!
  $reason: String!
  $referenceId: String
) {
  creditOrgWallet(
    orgId: $orgId
    amountCents: $amountCents
    reason: $reason
    referenceId: $referenceId
  ) {
    transactionId
    walletId
    orgId
    amountCents
    balanceAfter
    transactionType
    description
    referenceId
    appId
    createdAt
  }
}
