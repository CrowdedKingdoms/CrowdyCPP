query GetChunksByDistance($input: GetChunksByDistanceInput!) {
  getChunksByDistance(input: $input) {
    limit
    skip
    chunks {
      chunkId
      appId
      coordinates {
        x
        y
        z
      }
      voxels
      voxelStates {
        voxelCoord {
          x
          y
          z
        }
        voxelType
        state
      }
      owner
      createdAt
      updatedAt
      chunkState
      cdnUploadedAt
      lods {
        level
        data
      }
    }
  }
}
