# The metered model endpoint's GraphQL companions. The endpoint itself is
# REST (`GET /v1/model/models`, `POST /v1/model/chat/completions`, bearer =
# app token) and is what the Studio agent spends tokens through; these
# operations read what it recorded and gate whether it may run.

# A Studio dock asks this before the agent's draft_test or deploy_live: the mod
# build, deploy and switch-on calls do not check the app's Allow Live Modding.
query CrowdyStudioLiveModding($appId: BigInt!, $action: String!) {
  crowdyStudioLiveModding(appId: $appId, action: $action)
}

query CrowdyStudioProviderConsent($appId: BigInt!) {
  crowdyStudioProviderConsent(appId: $appId) {
    appId
    consented
    consentedAt
  }
}

mutation CrowdyStudioSetProviderConsent($input: SetCrowdyStudioProviderConsentInput!) {
  crowdyStudioSetProviderConsent(input: $input) {
    appId
    consented
    consentedAt
  }
}

query CrowdyStudioModelUsage($appId: BigInt!, $limit: Int) {
  crowdyStudioModelUsage(appId: $appId, limit: $limit) {
    appId
    payerKind
    todayRequests
    todayChargeMicrousd
    dayLimitMicrousd
    recent {
      usageId
      payerKind
      status
      requestedModel
      resolvedModel
      promptTokens
      completionTokens
      reasoningTokens
      chargeMicrousd
      occurredAt
      client
    }
  }
}
