name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  content-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public content policy
        run: bash scripts/check-content-policy.sh

  parity-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned CrowdyJS parity target
        uses: actions/checkout@v4
        with:
          repository: CrowdedKingdoms/CrowdyJS
          ref: a9c620c021c83c39f630dca4bb3e46b76691ac2d
          path: CrowdyJS
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            CrowdyJS/package-lock.json
      - name: Install CrowdyCPP maintainer tooling
        run: npm ci
      - name: Build pinned CrowdyJS fixtures and blueprints
        working-directory: CrowdyJS
        run: npm ci && npm run build
      - name: Parser and gate unit tests
        run: npm test
      - name: Check deterministic C++ codegen
        run: node scripts/codegen.mjs --check
      - name: Check schema, API, and generated matrix parity
        run: >
          node tools/parity/parity.mjs
          --crowdyjs "$GITHUB_WORKSPACE/CrowdyJS"
          --check docs/parity-matrix.md
      - name: Check agent descriptor and preemption fixtures
        run: >
          node tools/parity/agent-fixtures.mjs
          --crowdyjs "$GITHUB_WORKSPACE/CrowdyJS"
      - name: Install native parity dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev
      - name: Configure blueprint parity tool
        run: >
          cmake -S . -B build-parity -DCMAKE_BUILD_TYPE=Release
          -DCROWDY_BUILD_PARITY_TOOLS=ON
          -DCROWDY_BUILD_TESTS=OFF
          -DCROWDY_BUILD_E2E=OFF
          -DCROWDY_BUILD_BENCHMARKS=OFF
          -DCROWDY_BUILD_EXAMPLES=OFF
      - name: Build blueprint parity tool
        run: cmake --build build-parity --target crowdy_blueprint_dump -j 4
      - name: Check blueprint parity
        run: |
          node tools/parity/dump-blueprints.mjs "$GITHUB_WORKSPACE/CrowdyJS" > "$RUNNER_TEMP/crowdyjs-blueprints.json"
          ./build-parity/crowdy_blueprint_dump > "$RUNNER_TEMP/crowdycpp-blueprints.json"
          node tools/parity/blueprints-diff.mjs "$RUNNER_TEMP/crowdyjs-blueprints.json" "$RUNNER_TEMP/crowdycpp-blueprints.json"

  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev
      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install openssl@3 curl || true
      - name: Install deps (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install curl openssl --triplet x64-windows
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          ${{ runner.os == 'Windows' && '-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake' || '' }}
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
