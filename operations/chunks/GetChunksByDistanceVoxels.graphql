query GetChunksByDistanceVoxels($input: GetChunksByDistanceInput!) {
  getChunksByDistance(input: $input) {
    limit
    skip
    chunks {
      coordinates {
        x
        y
        z
      }
      voxels
      voxelStates {
        voxelCoord {
          x
          y
          z
        }
        voxelType
        state
      }
      voxelStatesTruncated
    }
  }
}
